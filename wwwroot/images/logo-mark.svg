<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130">
  <style>
    /* ── Logo Keyframe Animations ── */
    @keyframes blink {
      0%, 90%, 100% {
        transform: scaleY(1);
      }
      95% {
        transform: scaleY(0.1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-3px) rotate(-1.5deg);
      }
    }

    @keyframes shine {
      0%, 100% {
        filter: drop-shadow(0 0 0px rgba(255, 69, 0, 0));
      }
      50% {
        filter: drop-shadow(0 0 8px rgba(255, 84, 20, 0.6));
      }
    }

    #logo-mark-group {
      transform-origin: 80px 60px;
      animation: float 4s ease-in-out infinite, shine 4s ease-in-out infinite;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #logo-mark-group:hover {
      transform: scale(1.08) rotate(-3deg);
    }

    .eye {
      transform-origin: center;
      animation: blink 3.5s infinite ease-in-out;
    }
    .eye-right {
      animation-delay: 0.1s;
    }
  </style>

  <g id="logo-mark-group">
    <g id="logo-mark" fill="#FF4500">
      <!-- Outer Speech Bubble / Book Base Contour -->
      <path d="M 32 30 C 22 30 16 38 16 48 L 16 72 C 16 82 22 90 32 90 L 32 106 C 32 110 37 112 40 109 L 56 94 L 98 94 C 108 94 116 86 116 76 L 116 68 L 128 68 C 136 68 142 62 142 54 L 142 38 C 142 30 136 24 128 24 L 96 24 C 92 24 88 22 84 20 L 48 20 C 38 20 32 24 32 30 Z" />
      <path d="M 116 40 L 126 38 C 132 37, 136 41, 136 47 L 136 75 C 136 81, 132 85, 126 84 L 116 82 Z" fill="#FF4500" />

      <!-- Cute Blinking Eyes -->
      <ellipse class="eye eye-left" cx="58" cy="56" rx="7" ry="7" fill="#FFFFFF" />
      <ellipse class="eye eye-right" cx="94" cy="56" rx="7" ry="7" fill="#FFFFFF" />
    </g>
  </g>
</svg>
