<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* ── SVG Animations ── */
    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 3s infinite ease-in-out;
    }
    .eye-right {
      animation-delay: 0.05s;
    }

    @keyframes blink {
      0%, 88%, 98%, 100% {
        transform: scaleY(1);
      }
      93% {
        transform: scaleY(0.08);
      }
    }

    .eye.winking {
      animation: none !important;
      transform: scaleY(0.08) !important;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-6px) rotate(-1.5deg);
      }
    }

    @keyframes glow-pulse {
      0%, 100% {
        filter: drop-shadow(0 4px 10px rgba(255, 69, 0, 0.25));
      }
      50% {
        filter: drop-shadow(0 8px 24px rgba(255, 84, 20, 0.65));
      }
    }

    .logo-container {
      animation: float 3.6s ease-in-out infinite, glow-pulse 3.6s ease-in-out infinite;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .logo-container:hover {
      transform: scale(1.08) rotate(-2deg);
      filter: drop-shadow(0 12px 30px rgba(255, 69, 0, 0.8)) !important;
    }

    .book-left {
      transform-box: fill-box;
      transform-origin: right center;
      animation: page-flutter-left 3.6s ease-in-out infinite;
    }

    .book-right {
      transform-box: fill-box;
      transform-origin: left center;
      animation: page-flutter-right 3.6s ease-in-out infinite;
    }

    @keyframes page-flutter-left {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.96) skewY(1deg); }
    }

    @keyframes page-flutter-right {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.96) skewY(-1deg); }
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3 select-none flex flex-col items-center justify-center">

  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-5 shadow-xl w-full max-w-lg flex flex-col items-center gap-4">
    
    <!-- Header Badge -->
    <div class="flex items-center justify-between w-full border-b border-[var(--border)] pb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
        <span class="text-xs font-semibold tracking-wider text-[var(--muted-foreground)] uppercase">Live Animated SVG</span>
      </div>
      <span class="text-xs px-2 py-0.5 rounded-full bg-orange-500/10 text-orange-400 font-medium border border-orange-500/20">ReadIt Brand Mascot</span>
    </div>

    <!-- Main Live SVG Canvas -->
    <div class="p-6 rounded-xl bg-black/20 flex items-center justify-center w-full min-h-[140px]" id="stage">
      <div class="logo-container" id="logo-wrapper" title="Hover me or click to make me wink!">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="340" height="97" class="overflow-visible">
          <g id="logo-mark-group">
            <g id="logo-mark" fill="#FF4500">
              <!-- Left & Right Open Book Chat Bubble -->
              <path class="book-left" d="M 28 32 C 28 23, 35 16, 44 16 L 96 26 C 104 28, 108 34, 108 42 L 108 92 C 108 98, 103 103, 96 102 L 48 92 L 32 108 L 32 90 C 26 84, 28 76, 28 68 Z" />
              <path class="book-right" d="M 112 42 C 112 34, 116 28, 124 26 L 132 24 C 140 22, 148 28, 148 36 L 148 84 C 148 92, 140 98, 132 96 L 112 92 Z" />
              <path d="M 44 26 L 96 36 L 96 92 L 44 82 Z" fill="#FF5414" />
              <path d="M 108 42 C 108 34, 114 27, 124 25 L 134 23 C 142 21, 148 27, 148 35 L 148 83 C 148 90, 142 96, 134 94 L 108 90 Z" fill="#FF4500" />
              
              <!-- Outer Speech Bubble / Book Base Contour -->
              <path d="M 32 30 C 22 30 16 38 16 48 L 16 72 C 16 82 22 90 32 90 L 32 106 C 32 110 37 112 40 109 L 56 94 L 98 94 C 108 94 116 86 116 76 L 116 68 L 128 68 C 136 68 142 62 142 54 L 142 38 C 142 30 136 24 128 24 L 96 24 C 92 24 88 22 84 20 L 48 20 C 38 20 32 24 32 30 Z" />
              <path d="M 116 40 L 126 38 C 132 37, 136 41, 136 47 L 136 75 C 136 81, 132 85, 126 84 L 116 82 Z" fill="#FF4500" />

              <!-- Cute Blinking Eyes -->
              <ellipse id="eye-left" class="eye" cx="58" cy="56" rx="6.5" ry="6.5" fill="#FFFFFF" />
              <ellipse id="eye-right" class="eye eye-right" cx="94" cy="56" rx="6.5" ry="6.5" fill="#FFFFFF" />
            </g>
          </g>

          <!-- Brand Typography -->
          <text x="165" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FF4500" letter-spacing="-1.5">ReadIt</text>
        </svg>
      </div>
    </div>

    <!-- Interactive Controls -->
    <div class="flex items-center justify-between w-full text-xs text-[var(--muted-foreground)] px-1">
      <div class="flex items-center gap-2">
        <button id="btn-wink" class="px-3 py-1.5 rounded-lg bg-orange-600 hover:bg-orange-500 text-white font-medium transition active:scale-95 shadow">
          😉 Make it Wink
        </button>
        <button id="btn-cheer" class="px-3 py-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--accent)] hover:text-[var(--accent-foreground)] font-medium transition active:scale-95">
          🎉 Happy Bounce
        </button>
      </div>
      <span class="text-[11px] italic">💡 Hover over logo to inspect</span>
    </div>

  </div>

  <script>
    const logoWrapper = document.getElementById('logo-wrapper');
    const eyeRight = document.getElementById('eye-right');
    const btnWink = document.getElementById('btn-wink');
    const btnCheer = document.getElementById('btn-cheer');

    function triggerWink() {
      eyeRight.classList.add('winking');
      setTimeout(() => {
        eyeRight.classList.remove('winking');
      }, 700);
    }

    function triggerCheer() {
      logoWrapper.style.transform = 'translateY(-14px) scale(1.15) rotate(4deg)';
      triggerWink();
      setTimeout(() => {
        logoWrapper.style.transform = '';
      }, 500);
    }

    btnWink.addEventListener('click', triggerWink);
    btnCheer.addEventListener('click', triggerCheer);
    logoWrapper.addEventListener('click', triggerWink);
  </script>
</body>
</html>
